<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #111827, #020617 60%);
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }
      .game-shell { text-align: center; }
      .board {
        display: grid;
        grid-template-columns: repeat(4, 95px);
        gap: 12px;
        margin: 20px auto;
      }
      .card {
        width: 95px;
        height: 95px;
        border: none;
        border-radius: 14px;
        background: #38bdf8;
        color: white;
        font-size: 2rem;
        font-weight: bold;
        cursor: pointer;
      }
      .matched {
        background: #22c55e;
        cursor: default;
      }
      .status {
        font-size: 1.1rem;
        font-weight: bold;
      }
      button.restart {
        margin-top: 12px;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <h1>Memory Match</h1>
      <div class="status" id="status">Find all pairs</div>
      <div class="board" id="board"></div>
      <button class="restart" id="restartBtn">Restart</button>
    </div>
    <script src="game.js"></script>
  </body>
</html>
