<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <h1>Pong</h1>
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div class="hud">
        <span>Player 1: <strong id="leftScore">0</strong></span>
        <span>Player 2: <strong id="rightScore">0</strong></span>
      </div>
      <div class="controls">W/S = Left • ↑/↓ = Right • Space = Start</div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
